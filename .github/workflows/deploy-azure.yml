name: Despliegue Continuo API SIA en Azure

on:
  push:
    branches:
      - main
    paths:
      - 'API/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias NuGet
        run: dotnet restore API/src/Sia.Api/Sia.Api.csproj

      - name: Generar appsettings.json base
        run: cp API/src/Sia.Api/appsettings.Development.json.example API/src/Sia.Api/appsettings.json

      - name: Compilar Sia.Api (Release)
        run: dotnet build API/src/Sia.Api/Sia.Api.csproj --configuration Release --no-restore

      - name: Publicar Sia.Api
        run: |
          dotnet publish API/src/Sia.Api/Sia.Api.csproj --configuration Release --output ./publish-api
          cp API/src/Sia.Api/appsettings.Development.json.example ./publish-api/appsettings.json
          # Excluir FaceONNX.dll (177MB) en Linux para evitar agotar la cuota de red y RAM en Azure App Service F1
          rm -f ./publish-api/FaceONNX.dll

      - name: Limpiar paquetes antiguos en Azure
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USER=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userName="\([^"]*\)".*/\1/p' | head -1)
          PASS=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' | head -1)
          URL="sia-api-app.scm.azurewebsites.net"
          ACTIVE=$(curl -s -u "$USER:$PASS" "https://$URL/api/vfs/data/SitePackages/packagename.txt" || true)
          echo "Paquete activo actual: $ACTIVE"
          for zipfile in $(curl -s -u "$USER:$PASS" "https://$URL/api/vfs/data/SitePackages/" | jq -r '.[].name' | grep '\.zip$' || true); do
            if [ "$zipfile" != "$ACTIVE" ]; then
              echo "Eliminando backup obsoleto para liberar espacio: $zipfile"
              curl -s -X DELETE -H 'If-Match: *' -u "$USER:$PASS" "https://$URL/api/vfs/data/SitePackages/$zipfile" || true
            fi
          done

      - name: Desplegar a Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sia-api-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './publish-api'


