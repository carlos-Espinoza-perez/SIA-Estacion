name: Despliegue Continuo API SIA en Azure

on:
  push:
    branches:
      - main
    paths:
      - 'API/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias NuGet
        run: dotnet restore API/src/Sia.Api/Sia.Api.csproj

      - name: Generar appsettings.json base
        run: cp API/src/Sia.Api/appsettings.Development.json.example API/src/Sia.Api/appsettings.json

      - name: Compilar Sia.Api (Release)
        run: dotnet build API/src/Sia.Api/Sia.Api.csproj --configuration Release --no-restore

      - name: Publicar Sia.Api
        run: |
          dotnet publish API/src/Sia.Api/Sia.Api.csproj --configuration Release --output ./publish-api
          cp API/src/Sia.Api/appsettings.Development.json.example ./publish-api/appsettings.json
          # Excluir FaceONNX.dll (177MB) en Linux para evitar agotar la cuota de red y RAM en Azure App Service F1
          rm -f ./publish-api/FaceONNX.dll

      - name: Empaquetar artefacto en ZIP
        run: |
          cd ./publish-api
          zip -q -r ../api-deployment.zip .
          cd ..
          ls -lh api-deployment.zip

      - name: Desplegar a Azure Web App (ZipDeploy Asíncrono)
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USER=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userName="\([^"]*\)".*/\1/p' | head -1)
          PASS=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' | head -1)
          URL=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*publishUrl="\([^":]*\).*/\1/p' | head -1)
          
          if [ -z "$URL" ]; then
            URL="sia-api-app.scm.azurewebsites.net"
          fi
          
          echo "Conectando al servicio SCM en: $URL con usuario: $USER"
          
          echo "=== Iniciando subida de api-deployment.zip via /api/zipdeploy?isAsync=true ==="
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o upload_response.txt -X POST -u "$USER:$PASS" \
            -H "Content-Type: application/zip" \
            --data-binary @"./api-deployment.zip" \
            "https://$URL/api/zipdeploy?isAsync=true")
          
          echo "Código HTTP de subida: $HTTP_STATUS"
          cat upload_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "Error al subir paquete a Azure Web App (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "Paquete recibido correctamente. Monitoreando progreso del despliegue..."
          
          POLL_COUNT=0
          MAX_POLL=40
          SUCCESS=false

          while [ $POLL_COUNT -lt $MAX_POLL ]; do
            sleep 5
            STATUS_JSON=$(curl -s -u "$USER:$PASS" "https://$URL/api/deployments/latest")
            COMPLETE=$(echo "$STATUS_JSON" | jq -r '.complete // false')
            STATUS_CODE=$(echo "$STATUS_JSON" | jq -r '.status // 0')
            STATUS_MSG=$(echo "$STATUS_JSON" | jq -r '.message // ""')
            
            echo "Progreso [intento $((POLL_COUNT+1))/$MAX_POLL]: complete=$COMPLETE, status=$STATUS_CODE ($STATUS_MSG)"
            
            if [ "$COMPLETE" = "true" ]; then
              if [ "$STATUS_CODE" -eq 4 ]; then
                echo "¡Despliegue a Azure Web App completado exitosamente!"
                SUCCESS=true
                break
              else
                echo "El despliegue finalizó con error. Estado: $STATUS_CODE. Mensaje: $STATUS_MSG"
                echo "$STATUS_JSON" | jq . || true
                exit 1
              fi
            fi
            POLL_COUNT=$((POLL_COUNT + 1))
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Timeout esperando la finalización del despliegue en Kudu."
            exit 1
          fi

