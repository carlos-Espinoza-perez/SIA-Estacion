name: Despliegue Continuo API SIA en Azure

on:
  push:
    branches:
      - main
    paths:
      - 'API/**'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias NuGet
        run: dotnet restore API/src/Sia.Api/Sia.Api.csproj

      - name: Generar appsettings.json base
        run: cp API/src/Sia.Api/appsettings.Development.json.example API/src/Sia.Api/appsettings.json

      - name: Compilar Sia.Api (Release)
        run: dotnet build API/src/Sia.Api/Sia.Api.csproj --configuration Release --no-restore

      - name: Publicar Sia.Api
        run: |
          dotnet publish API/src/Sia.Api/Sia.Api.csproj --configuration Release --output ./publish-api
          cp API/src/Sia.Api/appsettings.Development.json.example ./publish-api/appsettings.json

      - name: Empaquetar artefacto en ZIP
        run: |
          cd ./publish-api
          zip -r ../api-deployment.zip .
          cd ..

      - name: Desplegar a Azure Web App (ZipDeploy)
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          USER=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userName="\([^"]*\)".*/\1/p' | head -1)
          PASS=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' | head -1)
          URL=$(echo "$PUBLISH_PROFILE" | sed -n 's/.*publishUrl="\([^":]*\).*/\1/p' | head -1)
          
          if [ -z "$URL" ]; then
            URL="sia-api-app.scm.azurewebsites.net"
          fi
          
          echo "Conectando al servicio SCM en: $URL con usuario: $USER"
          
          # Verificar estado y conectividad
          echo "=== Consultando estado e historial de Kudu ==="
          HTTP_TEST=$(curl -s -w "%{http_code}" -o kudu_test.txt -u "$USER:$PASS" "https://$URL/api/deployments")
          echo "HTTP Test de autenticación: $HTTP_TEST"
          cat kudu_test.txt | head -c 500
          echo ""

          # Desplegar paquete ZIP directamente via ZipDeploy
          echo "=== Iniciando despliegue de api-deployment.zip via /api/zipdeploy ==="
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o deploy_response.txt -X POST -u "$USER:$PASS" \
            --data-binary @"./api-deployment.zip" \
            "https://$URL/api/zipdeploy")
          
          echo "Respuesta del despliegue (HTTP $HTTP_STATUS):"
          cat deploy_response.txt
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 202 ]; then
            echo "=== Diagnostico de Error 400 en Kudu ==="
            echo "--- Listando archivos de traza Kudu ---"
            curl -s -u "$USER:$PASS" "https://$URL/api/vfs/LogFiles/kudu/trace/" | jq -r '.[-3:] | .[].name' || true
            LATEST_TRACE=$(curl -s -u "$USER:$PASS" "https://$URL/api/vfs/LogFiles/kudu/trace/" | jq -r '.[-1].name // empty')
            if [ -n "$LATEST_TRACE" ]; then
              echo "--- Contenido de la última traza ($LATEST_TRACE) ---"
              curl -s -u "$USER:$PASS" "https://$URL/api/vfs/LogFiles/kudu/trace/$LATEST_TRACE" | tail -n 50
            fi
            echo ""
            echo "--- Listando espacio y archivos en /site ---"
            curl -s -u "$USER:$PASS" "https://$URL/api/vfs/site/" | jq -r '.[] | "\(.name) - \(.size) bytes"' || true
            echo "Error en el despliegue a Azure Web App. Código HTTP: $HTTP_STATUS"
            exit 1
          fi
          echo "¡Despliegue a Azure Web App completado exitosamente!"

